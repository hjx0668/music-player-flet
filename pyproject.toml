[project]
name = "music-player"
version = "1.0.0"
description = "在线音乐搜索与流式播放器（Flet 版，支持手机/车机 APK）"
requires-python = ">=3.10"
dependencies = [
    # 只放运行时依赖；flet-cli 是构建期工具（CI 里单独 pip 装），
    # 写进项目依赖会被 serious_python 打进 APK 并因 watchdog 无 Android wheel 而失败
    "flet==0.28.3",
    # audio 控件自 flet 0.26 拆出独立包；不装的话 Android 客户端会报
    # "Unknown control: audio" 且无声（flet build 会自动编入其 Flutter 插件）
    "flet-audio==0.1.0",
]

[tool.flet]
# Android 目标 SDK 等保持模板默认

[tool.flet.android.manifest_application]
# Android 15（targetSdk 35）默认强制 edge-to-edge：状态栏/手势条透明，
# 内容会画到系统栏下面，表现为“状态栏消失、顶部被压住”。
# 该属性写入模板 AndroidManifest 的 <application>，恢复普通窗口布局（状态栏可见）。
# 注意：Android 16 起对 targetSdk 36 应用会失效，代码侧已用 SafeArea 兜底。
windowOptOutEdgeToEdgeEnforcement = "true"

[tool.flet.app]
# 应用文件就在仓库根目录，入口为 main.py
path = "."
