[project]
name = "music-player"
version = "1.0.0"
description = "在线音乐搜索与流式播放器（Flet 版，支持手机/车机 APK）"
requires-python = ">=3.10"
dependencies = [
    # 只放运行时依赖；flet-cli 是构建期工具（CI 里单独 pip 装），
    # 写进项目依赖会被 serious_python 打进 APK 并因 watchdog 无 Android wheel 而失败
    "flet==0.28.3",
]

[tool.flet]
# Android 目标 SDK 等保持模板默认

[tool.flet.app]
# 应用文件就在仓库根目录，入口为 main.py
path = "."
