name: Build APK

on:
  workflow_dispatch: {}   # 手动触发：仓库 Actions 页 -> Build APK -> Run workflow

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # flet 0.28.x 的 CLI 与新版 flet 的 `--version --json` 不兼容，
      # 官方 flet-build-action（v1/main 均为 uv 新版族）无法解析，故手动装配
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.28.3" "flet-cli==0.28.3"
          flet --version

      # runner 上部分新版 SDK 平台许可未自动接受，先全部接受
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 缓存 flet 自带的 Flutter SDK 与 Gradle 缓存，避免每次构建都重新下载
      - name: Cache Flutter/Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.flet
            ~/.gradle/caches
          key: flet-0.28.3-flutter-gradle-${{ hashFiles('requirements.txt') }}

      # ubuntu-latest 自带 Android SDK；Flutter SDK 由 flet build 自动下载。
      # 注意 flet 0.28 的 --android-permissions 要求 "<权限名>=True|False" 格式。
      # timeout 防止 runner 侧下载卡死把 job 挂满一小时
      - name: Build APK
        timeout-minutes: 40
        run: >
          flet build apk
          --split-per-abi
          --android-permissions android.permission.INTERNET=True

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: build/apk/**/*.apk
          if-no-files-found: error
