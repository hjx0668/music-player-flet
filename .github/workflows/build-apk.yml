name: Build APK

on:
  workflow_dispatch: {}   # 手动触发：仓库 Actions 页 -> Build APK -> Run workflow

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # flet 0.28.x 的 CLI 与新版 flet 的 `--version --json` 不兼容，
      # 官方 flet-build-action（v1/main 均为 uv 新版族）无法解析，故手动装配
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.28.3" "flet-cli==0.28.3"
          flet --version

      # ubuntu-latest 自带 Android SDK 且许可已接受；Flutter SDK 由 flet build 自动下载
      - name: Build APK
        run: >
          flet build apk
          --split-per-abi
          --android-permissions android.permission.INTERNET

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: build/apk/**/*.apk
          if-no-files-found: error
